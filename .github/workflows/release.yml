# Cuts a GitHub Release from a `v*` tag (ADR-0003, ADR-0011).
#
# One job for both platforms: GitHub's macOS runners are free for public
# repositories (Windows runners are billed), and electron-builder's NSIS
# target needs neither wine nor Rosetta on Apple Silicon (ticket 26), so the
# same runner produces the dmg/zip and the Setup.exe.
#
# The release is assembled by `gh release create` instead of electron-builder's
# own uploader, because that uploader creates a release per artifact it
# uploads, concurrently: the first publish of v1.0.0 produced TWO drafts with
# the assets split between them (the mac zip and the Windows setup in one, the
# dmg and `latest-mac.yml` in the other), so neither download link was a
# complete release. Building with `--publish never` and creating the release
# once makes that split impossible.
name: Release

on:
  push:
    tags: ["v*"]

# gh creates the release and uploads its assets with the workflow token; the
# default token is read-only and the upload would 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `gh release create --generate-notes` builds the notes from the
          # commit history, which the default single-commit fetch does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts skips the root `prepare` hook, which clones the
      # Effect repository into .repos/effect for a development skill - a large
      # download this job never reads. No package build is needed either:
      # electron-builder fetches its own Electron distribution, better-sqlite3
      # ships every platform's Node-API prebuild inside the tarball, and
      # vite/esbuild resolve their binaries from optional dependencies.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The tag is the version the release claims to be; a stale tag would
      # publish artifacts that update clients can never install.
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Package macOS
        run: pnpm make:mac

      - name: Package Windows
        run: pnpm make:win

      # A partial release is worse than a failed run: `gh release create`
      # would upload whatever it finds and leave the rest missing (exactly how
      # the two-draft v1.0.0 happened). Every artifact and both update feeds
      # must be on disk first.
      - name: Check the artifact set
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          for file in \
            "Email-Blast-$version-arm64.dmg" \
            "Email-Blast-$version-arm64.zip" \
            "Email-Blast-Setup-$version.exe" \
            latest-mac.yml \
            latest.yml
          do
            test -f "dist/$file" || { echo "::error::missing dist/$file"; exit 1; }
          done

      # Draft by design: colleagues see nothing until the maintainer reviews
      # and publishes it. Tick "pre-release" on a test build - shipped apps
      # ignore pre-releases (`allowPrerelease = false`), so only whoever
      # downloads it by hand ends up on it. The patterns are extension-explicit
      # because the Windows build also drops an intermediate `.7z` payload in
      # `dist/`, which must not become a release asset.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          gh release create "v$version" \
            --draft \
            --title "Email Blast $version" \
            --generate-notes \
            dist/Email-Blast-*.dmg \
            dist/Email-Blast-*.zip \
            dist/Email-Blast-Setup-*.exe \
            dist/*.blockmap \
            dist/latest.yml \
            dist/latest-mac.yml
